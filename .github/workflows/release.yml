name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build addon archive
        run: |
          git archive --format=zip \
            --prefix=addons/ragdoll2d/ \
            --output="ragdoll2d-${GITHUB_REF_NAME}.zip" \
            "HEAD:addons/ragdoll2d"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ragdoll2d-${GITHUB_REF_NAME}.zip" \
            --title "Ragdoll 2D ${GITHUB_REF_NAME}" \
            --generate-notes
